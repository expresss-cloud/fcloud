name: Test - Utah only
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - uses: actions/cache@v4          # keeps geocoded addresses between nights
        with:
          path: geocache.json
          key: geocache-${{ github.run_id }}
          restore-keys: geocache-
      - run: python scripts/fmcsa_nightly.py run --states UT --out data
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      - run: npx --yes netlify-cli deploy --prod --dir=. --functions=netlify/functions --no-build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
